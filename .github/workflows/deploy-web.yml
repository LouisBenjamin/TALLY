name: Deploy Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # Pinned: phosphor_flutter 2.1.0 (unmaintained) extends IconData, which
      # newer stable Flutter marks final. Bump deliberately when replacing that dep.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=REDIRECT_URL=${{ secrets.REDIRECT_URL }}

      # Deploy only from main, and only once Cloudflare is configured. Until the
      # CLOUDFLARE_API_TOKEN secret is set, the build above still runs on every
      # push/PR (validating the app) and the job stays green instead of red.
      - name: Deploy to Cloudflare Pages
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' }}
        # cloudflare/pages-action was retired; wrangler-action is its replacement.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=tally
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
