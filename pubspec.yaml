name: tally
description: Split expenses simply. A free, cross-platform alternative to Splitwise.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.0.0

  # Navigation
  go_router: ^14.0.0

  # State management (non-codegen for Push 1; Push 2 adds riverpod_annotation + build_runner)
  flutter_riverpod: ^2.0.0

  # Money — never use double for currency amounts
  decimal: ^2.3.3

  # Date/number formatting
  intl: ^0.19.0

  # Group photo picking (web + Android)
  image_picker: ^1.1.2

  # Bank statement import — RFC-4180 CSV parsing (quoted fields, CRLF)
  csv: ^6.0.0

  # Statement file picking. Always read with withData: true and use .bytes —
  # on web a picked file has no path, and the app has no dart:io anywhere.
  file_picker: ^8.0.0

  # SHA-256 for the opaque transaction fingerprint. Promoted from a transitive
  # dep of supabase_flutter so it can be imported directly.
  crypto: ^3.0.0

  # Icon set for the whole app, including category icons. Use the static-const
  # accessors (PhosphorIconsRegular.house), not PhosphorIcons.regular.house —
  # only the former is const, which --tree-shake-icons needs.
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Upstream phosphor_flutter declares all 6 weight fonts (Bold/Duotone/Fill/
# Light/Regular/Thin, ~2.6MB) unconditionally in its own pubspec, so Flutter
# bundles all of them regardless of which weight classes the app actually
# imports — font tree-shaking only shrinks each font's glyph set, it can't
# drop an entire unused font family. Tally only ever uses PhosphorIconsRegular
# (see lib/core/icons.dart), so this override swaps in a vendored copy with
# the other 5 fonts (~2.2MB of dead weight) stripped from its pubspec. The
# Dart API is untouched — see third_party/phosphor_flutter_regular/pubspec.yaml.
dependency_overrides:
  phosphor_flutter:
    path: third_party/phosphor_flutter_regular

flutter:
  uses-material-design: true

  # Plus Jakarta Sans, latin subset (covers French accents and €), bundled so
  # there's no runtime font fetch. OFL licence in assets/fonts/OFL.txt.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
